<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREEBIE HUB — pick a vault</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #4a3223;
    --bg-b: #311407;
    --surface: #513420;
    --border: #6c4829;
    --ink: #f9efe4;
    --muted: #bfa78f;
    --muted-2: #8a7159;
    --on-accent: #46210e;

    /* the three vault identities, lifted from each page's own head override */
    --c-web: #ffa552;   --c-web-2: #5ca6db;  --c-web-glow: 255,165,82;
    --c-apk: #ff7a3d;   --c-apk-2: #ffb347;  --c-apk-glow: 255,122,61;
    --c-vid: #ff5a3d;   --c-vid-2: #ffb347;  --c-vid-glow: 255,90,61;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ================= GATE VIEW ================= */
  #gate {
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    position: relative;
  }

  .gate-eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
    margin-bottom: 10px;
    opacity: 0;
    animation: rise 0.6s ease forwards 0.05s;
  }

  .gate-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5.5vw, 52px);
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 48px;
    opacity: 0;
    animation: rise 0.6s ease forwards 0.15s;
  }

  .gate-title span {
    background: linear-gradient(100deg, var(--c-web) 0%, var(--c-apk) 50%, var(--c-vid) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panels {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 1100px;
    height: min(56vh, 460px);
  }

  .panel {
    --pc: var(--c-web);
    --pc2: var(--c-web-2);
    --pglow: var(--c-web-glow);
    position: relative;
    flex: 1;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 22px;
    opacity: 0;
    transform: translateY(24px);
    animation: rise 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    transition: flex 0.55s cubic-bezier(.2,.8,.2,1), border-color 0.3s ease, transform 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .panel:nth-child(1) { animation-delay: 0.25s; }
  .panel:nth-child(2) { animation-delay: 0.35s; --pc: var(--c-apk); --pc2: var(--c-apk-2); --pglow: var(--c-apk-glow); }
  .panel:nth-child(3) { animation-delay: 0.45s; --pc: var(--c-vid); --pc2: var(--c-vid-2); --pglow: var(--c-vid-glow); }

  .panel::before {
    /* ambient glow field, brightens on hover */
    content: '';
    position: absolute;
    inset: -40% -40% auto -40%;
    height: 90%;
    background: radial-gradient(circle at 50% 0%, rgba(var(--pglow), 0.35), transparent 65%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .panel::after {
    /* bottom accent bar */
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--pc);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }

  .panel:hover,
  .panel:focus-visible {
    flex: 1.35;
    border-color: var(--pc);
    transform: translateY(-6px);
  }

  .panel:hover::before,
  .panel:focus-visible::before { opacity: 1; }

  .panel:hover::after,
  .panel:focus-visible::after { transform: scaleX(1); }

  .panel:focus-visible { outline: 2px solid var(--pc); outline-offset: 3px; }

  .panel:active { transform: translateY(-2px) scale(0.99); }

  .panel-glyph {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(var(--pglow), 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 22px;
    position: relative;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.3s ease;
  }

  .panel:hover .panel-glyph,
  .panel:focus-visible .panel-glyph {
    transform: scale(1.1) rotate(-4deg);
    border-color: var(--pc);
  }

  .panel-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(19px, 2.6vw, 26px);
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 10px;
    position: relative;
    white-space: nowrap;
  }

  .panel-desc {
    font-size: 11.5px;
    color: var(--muted-2);
    line-height: 1.6;
    max-width: 220px;
    position: relative;
    transition: color 0.3s ease;
  }

  .panel:hover .panel-desc,
  .panel:focus-visible .panel-desc { color: var(--muted); }

  .panel-cta {
    margin-top: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--pc);
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    position: relative;
  }

  .panel:hover .panel-cta,
  .panel:focus-visible .panel-cta { opacity: 1; transform: translateY(0); }

  .panel-cta .arrow { transition: transform 0.3s ease; }
  .panel:hover .panel-cta .arrow,
  .panel:focus-visible .panel-cta .arrow { transform: translateX(3px); }

  .gate-footer {
    margin-top: 40px;
    font-size: 10px;
    color: var(--muted-2);
    letter-spacing: 0.5px;
    opacity: 0;
    animation: rise 0.6s ease forwards 0.55s;
  }

  /* ============ GATE HIDDEN STATE ============ */
  #gate.hidden {
    display: none;
  }

  /* ================= VIEWER VIEW ================= */
  #viewer {
    height: 100vh;
    width: 100%;
    display: none;
    flex-direction: column;
  }

  #viewer.active { display: flex; }

  .viewer-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: rgba(47, 38, 32, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    border-top: 3px solid var(--vc, var(--c-web));
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    padding: 9px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    flex-shrink: 0;
  }

  .back-btn:hover { border-color: var(--vc, var(--c-web)); background: var(--surface-hover, #3a2f27); }
  .back-btn:active { transform: scale(0.96); }
  .back-btn:focus-visible { outline: 2px solid var(--vc, var(--c-web)); outline-offset: 2px; }

  .viewer-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .viewer-title span { color: var(--vc, var(--c-web)); }

  .viewer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--vc, var(--c-web));
    box-shadow: 0 0 8px var(--vc, var(--c-web));
    flex-shrink: 0;
  }

  .viewer-frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #viewer-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  #viewer-frame.loaded { opacity: 1; }

  .frame-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted-2);
    background: var(--bg-a);
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .frame-loader.done { opacity: 0; }

  .spin {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--vc, var(--c-web));
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 780px) {
    html, body { height: auto; overflow: auto; }
    #gate { height: auto; min-height: 100vh; padding: 32px 20px; }
    .panels {
      flex-direction: column;
      height: auto;
      max-width: 420px;
    }
    .panel {
      flex: none !important;
      width: 100%;
      padding: 26px 22px;
      transform: none;
      animation: rise 0.5s ease forwards;
    }
    .panel:hover, .panel:focus-visible { transform: none; }
    .panel-desc { max-width: none; }
    .viewer-bar { padding: 12px 16px; }
    .viewer-title { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-eyebrow">Freebie Hub</div>
  <h1 class="gate-title">Pick your <span>vault</span></h1>

  <div class="panels" id="panels">
    <button class="panel" type="button" data-src="web.html" data-title="The Vault" data-label="Websites" style="--pc: var(--c-web); --pc2: var(--c-web-2); --pglow: var(--c-web-glow);">
      <div class="panel-glyph">🌐</div>
      <div class="panel-name">Websites</div>
      <div class="panel-desc">Every free tool site worth bookmarking — design, AI, dev, research, all in one shelf.</div>
      <div class="panel-cta">Open the vault <span class="arrow">→</span></div>
    </button>

    <button class="panel" type="button" data-src="apps.html" data-title="Droid" data-label="APKs" style="--pc: var(--c-apk); --pc2: var(--c-apk-2); --pglow: var(--c-apk-glow);">
      <div class="panel-glyph">📦</div>
      <div class="panel-name">APKs</div>
      <div class="panel-desc">Android toolkit — modded apps, launchers, and utilities, ready to sideload.</div>
      <div class="panel-cta">Open the vault <span class="arrow">→</span></div>
    </button>

    <button class="panel" type="button" data-src="tools.html" data-title="Blitz Stack" data-label="Vid Editing" style="--pc: var(--c-vid); --pc2: var(--c-vid-2); --pglow: var(--c-vid-glow);">
      <div class="panel-glyph">🎬</div>
      <div class="panel-name">Vid Editing</div>
      <div class="panel-desc">Cutting, captions, effects, exports — the whole free editing stack in one place.</div>
      <div class="panel-cta">Open the vault <span class="arrow">→</span></div>
    </button>
  </div>

  <div class="gate-footer">FREEBIE HUB — pick one, everything opens right here</div>
</div>

<div id="viewer">
  <div class="viewer-bar">
    <button class="back-btn" id="back-btn" type="button">
      <span>←</span> Back
    </button>
    <span class="viewer-dot"></span>
    <span class="viewer-title" id="viewer-title">Loading<span>…</span></span>
  </div>
  <div class="viewer-frame-wrap">
    <div class="frame-loader" id="frame-loader">
      <span class="spin"></span> Loading vault
    </div>
    <iframe id="viewer-frame" title="vault content"></iframe>
  </div>
</div>

<script>
  const gate = document.getElementById('gate');
  const viewer = document.getElementById('viewer');
  const frame = document.getElementById('viewer-frame');
  const frameLoader = document.getElementById('frame-loader');
  const viewerTitle = document.getElementById('viewer-title');
  const backBtn = document.getElementById('back-btn');
  const panels = document.querySelectorAll('.panel');

  function openVault(panel) {
    const src = panel.dataset.src;
    const title = panel.dataset.title;
    const label = panel.dataset.label;
    const pc = getComputedStyle(panel).getPropertyValue('--pc').trim();

    viewer.style.setProperty('--vc', pc);
    viewerTitle.innerHTML = `${title} <span>· ${label}</span>`;

    frame.classList.remove('loaded');
    frameLoader.classList.remove('done');
    frame.src = src;

    gate.classList.add('hidden');
    viewer.classList.add('active');

    history.pushState({ vault: src }, '', '#' + src.replace('.html', ''));
  }

  function closeVault(pushState = true) {
    viewer.classList.remove('active');
    gate.classList.remove('hidden');
    frame.src = 'about:blank';
    if (pushState) history.pushState({}, '', location.pathname);
  }

  panels.forEach(panel => {
    panel.addEventListener('click', () => openVault(panel));
  });

  backBtn.addEventListener('click', () => closeVault());

  frame.addEventListener('load', () => {
    if (frame.src === 'about:blank' || !frame.src) return;
    frame.classList.add('loaded');
    frameLoader.classList.add('done');
  });

  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.vault) {
      const p = [...panels].find(x => x.dataset.src === e.state.vault);
      if (p) openVault(p);
    } else {
      closeVault(false);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && viewer.classList.contains('active')) closeVault();
  });

  // deep-link support: freebie_hub.html#apps etc.
  window.addEventListener('DOMContentLoaded', () => {
    const hash = location.hash.replace('#', '');
    if (hash) {
      const p = [...panels].find(x => x.dataset.src === hash + '.html');
      if (p) openVault(p);
    }
  });
</script>

</body>
</html>
