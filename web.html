let allCards = [];

function buildUI() {
  const main = document.getElementById('main');
  const filtersDiv = document.getElementById('filters');
  let totalCount = 0;

  const allBtn = document.createElement('button');
  allBtn.className = 'fbtn active';
  allBtn.textContent = 'ALL';
  allBtn.dataset.filter = 'all';
  filtersDiv.appendChild(allBtn);

  data.forEach(section => {
    const btn = document.createElement('button');
    btn.className = 'fbtn';
    btn.textContent = section.category;
    btn.dataset.filter = section.category;
    filtersDiv.appendChild(btn);

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.category = section.category;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `<span class="section-title">${section.category}</span><span class="section-count">${section.items.length} tools</span>`;
    sec.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'grid';

    section.items.forEach(item => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = item.url.startsWith('http') ? item.url : 'https://' + item.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.dataset.name = item.name.toLowerCase();
      card.dataset.desc = item.desc.toLowerCase();
      card.dataset.category = section.category;

      card.innerHTML = `
        <div class="card-name">${item.name} <span class="arrow">→</span></div>
        <div class="card-desc">${item.desc}</div>
      `;

      grid.appendChild(card);
      allCards.push(card);
      totalCount++;
    });

    sec.appendChild(grid);
    main.appendChild(sec);
  });

  document.getElementById('total-count').textContent = `${totalCount} tools`;
  updateCount();
}

function updateCount() {
  const visible = allCards.filter(c => !c.classList.contains('hidden')).length;
  document.getElementById('count').textContent = visible + ' tools';
}

function filterByCategory(cat) {
  document.querySelectorAll('.fbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === cat);
  });

  document.querySelectorAll('.section').forEach(sec => {
    if (cat === 'all' || sec.dataset.category === cat) {
      sec.classList.remove('hidden');
    } else {
      sec.classList.add('hidden');
    }
  });

  const q = document.getElementById('search').value.trim().toLowerCase();
  if (q) doSearch(q);
  else {
    allCards.forEach(c => {
      const secHidden = c.closest('.section').classList.contains('hidden');
      c.classList.toggle('hidden', secHidden);
    });
    updateCount();
  }
}

function matchesQuery(name, q) {
  return name.includes(q);
}

function doSearch(q) {
  const activeBtn = document.querySelector('.fbtn.active');
  const catOn = activeBtn ? activeBtn.dataset.filter : 'all';
  document.querySelectorAll('.section').forEach(sec => {
    const catHidden = catOn !== 'all' && sec.dataset.category !== catOn;
    let anyMatch = false;
    sec.querySelectorAll('.card').forEach(card => {
      const match = !catHidden && matchesQuery(card.dataset.name, q);
      card.classList.toggle('hidden', !match);
      if (match) anyMatch = true;
    });
    sec.classList.toggle('hidden', catHidden || !anyMatch);
  });
  updateCount();
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    allCards.forEach(card => {
      const secHidden = card.closest('.section').classList.contains('hidden');
      card.classList.toggle('hidden', secHidden);
    });
    updateCount();
    return;
  }
  doSearch(q);
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.fbtn');
  if (!btn) return;
  filterByCategory(btn.dataset.filter);
});
